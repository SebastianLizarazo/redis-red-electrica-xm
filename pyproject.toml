[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-red-electrica-xm"
version = "0.1.0"
description = "Monitor de red eléctrica colombiana en tiempo real con Redis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sebastian Lizarazo" },
    { name = "Edwar" },
    { name = "Alejandro" },
    { name = "David" },
    { name = "Jonathan" },
]
keywords = ["redis", "fastapi", "real-time", "energy", "colombia", "xm"]

# Runtime dependencies — fijadas mayormente; pydantic 2.x y redis 5.x
# son los contratos no negociables para que fakeredis 2.x funcione
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    # Pinned <9 porque fakeredis>=2.20 requires redis>=8.0; API estable a través de 5.x→8.x
    "redis>=5.0,<9",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "sse-starlette>=2.0,<3.0",
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "fakeredis>=2.20,<3.0",
    "respx>=0.21,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "types-redis>=4.6,<5.0",
    "pydataxm>=0.1,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "publisher*", "subscriber*", "api*"]
exclude = [
    "tests*",
    "dashboard*",
    "docs*",
    "infra*",
]

# Configuración de pytest: modo asyncio auto, tests en /tests
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
# `conftest.py` marca automáticamente tests/unit y tests/integration. Con
# `--strict-markers` activo, un marcador no declarado aquí aborta la
# colección entera, así que ambos tienen que existir en esta lista.
markers = [
    "unit: test unitario, sin IO real (usa fakeredis/respx)",
    "integration: test que requiere servicios externos como Redis",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:uvicorn.*",
    "ignore::PendingDeprecationWarning",
    # pytest-asyncio <1.0 todavía usa la API de event loop policy que Python
    # 3.14 deprecó. Sin este filtro, `error` lo convierte en fallo y la suite
    # entera no arranca en distros con Python >= 3.14 (Arch, Fedora).
    # Se puede quitar al subir a pytest-asyncio 1.x.
    "ignore:.*event_loop_policy.*:DeprecationWarning",
]

# Linting: ruff minimalista para un taller académico
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "dashboard/dist",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Reglas razonables: errorees reales, no estilo bikeshedding
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long: ruff line-length ya lo cubre
    "B008",  # function call in default argument (Pydantic Field)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # tests pueden usar asserts

# Type checking: strict=False pero con las verificaciones útiles activadas
[tool.mypy]
python_version = "3.12"
mypy_path = "."
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = true
warn_unused_configs = true
discover_untyped_supports = false
check_untyped_defs = true
ignore_missing_imports = false
exclude = [
    "dashboard/",
    "tests/",
    ".venv/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = "fakeredis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydataxm.*"
ignore_missing_imports = true
